<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Callista Jasmine | Hybrid Portfolio</title>
    <style>
        /* =========================================
           VARIABLE WARNA (CSS VARIABLES)
           ========================================= */
        :root {
            /* Light Theme (Default) */
            --bg-color: #f0f2f5;
            --glass-bg: rgba(255, 255, 255, 0.4);
            --glass-border: rgba(255, 255, 255, 0.5);
            --text-main: #2c3e50;
            --text-sub: #555;
            --accent: #ff9a9e; /* Pink soft */
            --glow: rgba(255, 154, 158, 0.3);
        }

        [data-theme="dark"] {
            /* Dark Theme */
            --bg-color: #0a0a0c;
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-main: #ffffff;
            --text-sub: rgba(255, 255, 255, 0.7);
            --accent: #a8edea; /* Tosca neon */
            --glow: rgba(168, 237, 234, 0.3);
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            transition: background-color 0.5s ease, color 0.5s ease;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Ambient Blobs di Background */
        .blob {
            position: fixed;
            width: 500px;
            height: 500px;
            background: var(--accent);
            filter: blur(100px);
            z-index: -1;
            opacity: 0.2;
            border-radius: 50%;
            animation: move 15s infinite alternate;
        }

        @keyframes move {
            from { transform: translate(-20%, -20%); }
            to { transform: translate(20%, 20%); }
        }

        /* =========================================
           NAVIGATION & TOGGLE
           ========================================= */
        nav {
            width: 100%;
            max-width: 900px;
            padding: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .theme-toggle {
            cursor: pointer;
            padding: 10px 20px;
            border-radius: 50px;
            border: 1px solid var(--glass-border);
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            color: var(--text-main);
            font-weight: 600;
            font-size: 0.8rem;
            transition: 0.3s;
        }

        .theme-toggle:hover {
            transform: scale(1.05);
            box-shadow: 0 0 15px var(--glow);
        }

        /* =========================================
           BENTO LAYOUT
           ========================================= */
        .container {
            display: grid;
            grid-template-columns: 1.5fr 1fr;
            grid-template-rows: auto auto;
            gap: 20px;
            width: 90%;
            max-width: 900px;
            padding-bottom: 50px;
        }

        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border);
            border-radius: 28px;
            padding: 35px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            transition: 0.3s;
        }

        .profile-card { grid-row: span 2; text-align: center; }

        .profile-img {
            width: 110px;
            height: 110px;
            background: var(--glass-border);
            border-radius: 50%;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Typography */
        h1 { font-size: 2.2rem; margin: 10px 0; }
        .gradient-text {
            background: linear-gradient(90deg, #a8edea, #fed6e3, #a8edea);
            background-size: 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: flow 5s linear infinite;
        }

        @keyframes flow { to { background-position: 200%; } }

        p { color: var(--text-sub); line-height: 1.6; }

        /* Buttons */
        .btn {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 25px;
            border-radius: 15px;
            text-decoration: none;
            background: var(--text-main);
            color: var(--bg-color);
            font-weight: bold;
            transition: 0.3s;
        }

        .btn:hover { transform: translateY(-3px); box-shadow: 0 5px 20px var(--glow); }

        /* Responsive */
        @media (max-width: 768px) {
            .container { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body data-theme="light">

    <div class="blob"></div>

    <nav>
        <div style="font-weight: 800; font-size: 1.2rem;">Callista<span class="gradient-text">.J</span></div>
        <button class="theme-toggle" onclick="toggleTheme()">Ganti Mode ✨</button>
    </nav>

    <div class="container">
        <!-- Kartu Utama -->
        <div class="glass-card profile-card">
            <div class="profile-img">Foto</div>
            <h1>Hi, I'm <span class="gradient-text">Callista</span></h1>
            <p>UI Enthusiast & Modern Web Architect. Fokus membangun antarmuka yang clean dengan sentuhan interaktif.</p>
            <a href="#" class="btn">Mari Berdiskusi</a>
        </div>

        <!-- Kartu Skill -->
        <div class="glass-card">
            <h3 style="margin-top: 0;">🚀 My Tech</h3>
            <p style="font-size: 0.9rem;">HTML, CSS, JS, VS Code, GitHub.</p>
        </div>

        <!-- Kartu Quote/Status -->
        <div class="glass-card">
            <h3 style="margin-top: 0;">💬 Status</h3>
            <p style="font-size: 0.9rem; font-style: italic;">"Sedang asik ngulik glassmorphism di hari Rabu."</p>
        </div>
    </div>

    <!-- JAVASCRIPT UNTUK SWAP TEMA -->
    <script>
        function toggleTheme() {
            const body = document.body;
            const currentTheme = body.getAttribute('data-theme');
            const newTheme = currentTheme === 'light' ? 'dark' : 'light';
            
            body.setAttribute('data-theme', newTheme);
            
            // Simpan teks tombol agar berubah sesuai mode
            const btn = document.querySelector('.theme-toggle');
            btn.innerHTML = newTheme === 'light' ? 'Mode Gelap 🌙' : 'Mode Terang ☀️';
        }
    </script>
</body>
</html>
